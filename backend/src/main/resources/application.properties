spring.application.name=bluemoon-backend
server.port=8080

# Nạp cấu hình riêng trên máy từng thành viên (không đẩy lên Git)
spring.config.import=optional:classpath:application-local.properties

# Cấu hình JPA / Hibernate (nhóm dùng script SQL chung nên không tự sửa bảng)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
